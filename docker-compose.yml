services:
  postgres:
    image: postgres:16
    container_name: smgnews-pg
    environment:
      POSTGRES_DB: smgnews
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smgnews"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mariadb:
    image: mariadb:11
    container_name: smgnews-mariadb
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: ${MYSQL_USER:-wp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wpsecret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  wordpress:
    image: wordpress:php8.2-apache
    container_name: smgnews-wp
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: ${MYSQL_USER:-wp}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wpsecret}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_TABLE_PREFIX: wp_
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - wp_data:/var/www/html
      - ./smgnews-redirect/:/var/www/html/wp-content/themes/smgnews-redirect
      - ./poll-manager/:/var/www/html/wp-content/plugins/poll-manager
      - ./docker/mu-plugins/:/var/www/html/wp-content/mu-plugins
    restart: unless-stopped

  wp-setup:
    image: wordpress:cli-php8.2
    user: root
    container_name: smgnews-wp-setup
    depends_on:
      - wordpress
      - mariadb
    volumes:
      - wp_data:/var/www/html
      - ./docker/wp-setup.sh:/setup/wp-setup.sh:ro
      - ./smgnews-redirect/:/var/www/html/wp-content/themes/smgnews-redirect:ro
      - ./poll-manager/:/var/www/html/wp-content/plugins/poll-manager:ro
      - secrets:/run/secrets
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: ${MYSQL_USER:-wp}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wpsecret}
      WORDPRESS_DB_NAME: wordpress
      WP_HOME: ${WP_HOME:-http://localhost:8080}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-changeme}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@local.host}
      WP_COMMENTS_USERNAME: ${WP_COMMENTS_USERNAME:-comments}
      WP_COMMENTS_EMAIL: ${WP_COMMENTS_EMAIL:-comments@local.host}
      POLL_MANAGER_API_ROOT: ${POLL_MANAGER_API_ROOT:-http://web:3000/api}
    entrypoint: ["sh", "/setup/wp-setup.sh"]
    restart: "no"

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_WP_REST_ENDPOINT: ${NEXT_PUBLIC_WP_REST_ENDPOINT:-http://wordpress:80/wp-json/wp/v2}
        WP_HOME: ${WP_HOME:-http://localhost:8080}
    container_name: smgnews-web
    depends_on:
      postgres:
        condition: service_healthy
      wp-setup:
        condition: service_completed_successfully
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/smgnews}
      NEXT_PUBLIC_WP_REST_ENDPOINT: ${NEXT_PUBLIC_WP_REST_ENDPOINT:-http://wordpress:80/wp-json/wp/v2}
      WP_COMMENTS_USERNAME: ${WP_COMMENTS_USERNAME:-comments}
    volumes:
      - secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  pg_data:
  mariadb_data:
  wp_data:
  secrets:
